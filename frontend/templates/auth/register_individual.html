{% extends 'base.html' %}

{% block title %}Individual Sign Up{% endblock %}

{% block content %}

<div class="form-box">

    <p><a href="{{ url_for('signup') }}">&larr; Back</a></p>
    <h1 class="mb-4">Sign up as an Individual</h1>

    <div class="box">
        <form id="registration-form" method="post" action="{{ url_for('register_individual') }}">

            <div class="mb-3">
                <label for="full_name" class="form-label">Full name</label>
                <input type="text" id="full_name" name="full_name" class="form-control" value="{{ request.form.get('full_name', '') }}" required>
            </div>

            <div class="mb-3">
                <label for="email" class="form-label">Email</label>
                <input type="email" id="email" name="email" class="form-control" value="{{ request.form.get('email', '') }}" required>
            </div>

            <div class="mb-3">
                <label for="phone" class="form-label">Phone number</label>
                <input type="tel" pattern="[+0-9\(\) .\-]{7,25}" title="Enter a phone number with 7 to 15 digits." autocomplete="tel" id="phone" name="phone" class="form-control" value="{{ request.form.get('phone', '') }}" required>
            </div>

            <div class="mb-3">
                <label for="address" class="form-label">Address</label>
                <input type="text" id="address" name="address" class="form-control" value="{{ request.form.get('address', '') }}" required>
            </div>

            <div class="mb-3">
                <label for="city" class="form-label">City</label>
                <input type="text" id="city" name="city" class="form-control" value="{{ request.form.get('city', '') }}" required>
            </div>

            <div class="mb-3">
                <label for="password" class="form-label">Password</label>
                <input type="password" id="password" name="password" class="form-control" minlength="6" required>
                <div class="form-hint">At least 6 characters.</div>
            </div>

            <div class="mb-4">
                <label for="confirm_password" class="form-label">Confirm password</label>
                <input type="password" id="confirm_password" name="confirm_password" class="form-control" required>
            </div>

            <button type="submit" class="btn-main w-100">Validate signup details</button>
        </form>
    </div>

    <p class="mt-3">Already have an account? <a href="{{ url_for('login') }}">Log in</a></p>
</div>

{% endblock %}

{% block scripts %}
<script id="firebase-web-config" type="application/json">{{ firebase_web_config | tojson }}</script>
<script type="module" src="{{ url_for('static', filename='js/register.js') }}"></script>
{% endblock %}
