<ul id="password-requirements" class="password-requirements" aria-label="Password requirements" aria-live="polite">
    <li data-password-requirement="length">
        <span data-requirement-icon aria-hidden="true">○</span>
        <span>Minimum 8 characters. <span class="visually-hidden" data-requirement-status>Not yet satisfied.</span></span>
    </li>
    <li data-password-requirement="uppercase">
        <span data-requirement-icon aria-hidden="true">○</span>
        <span>At least one uppercase letter (A–Z). <span class="visually-hidden" data-requirement-status>Not yet satisfied.</span></span>
    </li>
    <li data-password-requirement="special">
        <span data-requirement-icon aria-hidden="true">○</span>
        <span>At least one special character (e.g., @, #, $, !, %). <span class="visually-hidden" data-requirement-status>Not yet satisfied.</span></span>
    </li>
</ul>
