{% extends 'base.html' %}
{% from 'components/macros.html' import status_label %}

{% block title %}Organization Profile{% endblock %}

{% block content %}

<div class="form-box-wide">

    <h1 class="mb-4">Organization Profile</h1>
    <p>Approval status: {{ status_label(org.status) }}</p>

    <div class="box mb-4">
        <form method="post" action="{{ url_for('org_profile') }}">
            <input type="hidden" name="form_type" value="details">
            <input type="hidden" name="csrf_token" value="{{ organization_csrf }}">

            <div class="row g-3">
                <div class="col-12">
                    <label for="org_name" class="form-label">Organization name</label>
                    <input type="text" id="org_name" class="form-control" value="{{ org.org_name }}" readonly>
                </div>

                <div class="col-12 col-md-6">
                    <label for="contact_name" class="form-label">Contact person</label>
                    <input type="text" id="contact_name" name="contact_name" class="form-control" value="{{ org.contact_name }}" required>
                </div>

                <div class="col-12 col-md-6">
                    <label for="phone" class="form-label">Phone number</label>
                    <input type="tel" pattern="[+0-9\(\) .\-]{7,25}" title="Enter a phone number with 7 to 15 digits." autocomplete="tel" id="phone" name="phone" class="form-control" value="{{ org.phone }}" required>
                </div>

                <div class="col-12 col-md-6">
                    <label for="email" class="form-label">Email</label>
                    <input type="email" id="email" class="form-control" value="{{ org.email }}" readonly>
                </div>

                <div class="col-12 col-md-6">
                    <label for="address" class="form-label">Address</label>
                    <input type="text" id="address" name="address" class="form-control" value="{{ org.address }}" required>
                </div>

                <div class="col-12 col-md-6">
                    <label for="city" class="form-label">City</label>
                    <input type="text" id="city" name="city" class="form-control" value="{{ org.city }}" required>
                </div>
                <div class="col-12">
                    <label for="service_area" class="form-label">Service area</label>
                    <input type="text" id="service_area" class="form-control" value="{{ org.service_area }}" readonly>
                </div>
            </div>

            <button type="submit" class="btn-main mt-3">Save Changes</button>
        </form>
    </div>

    <div class="box">
        <h3 class="mb-3">Change password</h3>

        <form id="password-change-form" method="post" action="{{ url_for('org_profile') }}" data-context-url="{{ url_for('organization.password_context') }}">
            <input type="hidden" name="form_type" value="password">
            <input type="hidden" name="csrf_token" value="{{ organization_csrf }}">

            <div class="mb-3">
                <label for="old_password" class="form-label">Current password</label>
                <input type="password" id="old_password" class="form-control" autocomplete="current-password" required>
            </div>

            <div class="mb-3">
                <label for="password" class="form-label">New password</label>
                <input type="password" id="password" class="form-control" autocomplete="new-password" minlength="6" required>
            </div>

            <div class="mb-3">
                <label for="confirm_password" class="form-label">Confirm new password</label>
                <input type="password" id="confirm_password" class="form-control" autocomplete="new-password" required>
            </div>

            <button type="submit" class="btn-main">Change password</button>
        </form>
    </div>

</div>

{% endblock %}

{% block scripts %}
<script id="firebase-web-config" type="application/json">{{ firebase_web_config | tojson }}</script>
<script type="module" src="{{ url_for('static', filename='js/password-change.js') }}"></script>
{% endblock %}
