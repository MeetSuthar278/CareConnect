{% extends 'base.html' %}

{% block title %}Feedback{% endblock %}

{% block content %}

<div class="form-box">

    <p><a href="{{ url_for('request_details', request_id=req.request_id) }}">&larr; Back to request</a></p>
    <h1 class="mb-1">Feedback</h1>
    <p class="text-muted-cc mb-4">Request {{ req.reference }} - {{ req.service_name }}</p>

    <div class="box">
        <form method="post" action="{{ url_for('feedback', request_id=req.request_id) }}">
            <input type="hidden" name="csrf_token" value="{{ member_csrf }}">

            <fieldset class="mb-3">
                <legend class="form-label">Was this service helpful?</legend>
                {% for value,label in [('yes','Yes'),('no','No')] %}
                    <div class="form-check form-check-inline">
                        <input class="form-check-input" type="radio" name="is_helpful" id="helpful_{{ value }}" value="{{ value }}" {% if request.form.get('is_helpful') == value %}checked{% endif %} required>
                        <label class="form-check-label" for="helpful_{{ value }}">{{ label }}</label>
                    </div>
                {% endfor %}
            </fieldset>

            <div class="mb-4">
                <label for="comment" class="form-label">Comment (optional)</label>
                <textarea id="comment" name="comment" class="form-control" rows="3" maxlength="2000">{{ request.form.get('comment','') }}</textarea>
            </div>

            <button type="submit" class="btn-main">Send Feedback</button>
        </form>
    </div>

</div>

{% endblock %}
